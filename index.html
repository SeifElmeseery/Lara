<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lara ✦ English Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&family=Cormorant+Garamond:wght@700;800&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f7c5d5;
    --mauve: #c9a0dc;
    --champagne: #f5e6c8;
    --burgundy: #7b2d5e;
    --rose-dark: #b5446e;
    --cream: #fdf6f0;
    --gold: #d4a843;
    --deep: #2a1a2e;
    --glass: rgba(255,255,255,0.18);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    font-family: 'Tajawal', sans-serif;
    background: #1a0a2e;
    overflow-x: hidden;
    position: relative;
    cursor: default;
  }

  /* Aurora background */
  .aurora {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none; overflow: hidden;
  }
  .aurora-layer {
    position: absolute; border-radius: 50%;
    filter: blur(80px); mix-blend-mode: screen;
    animation: auroraMove linear infinite;
  }
  @keyframes auroraMove {
    0%   { transform: translate(0,0) scale(1); }
    33%  { transform: translate(60px,-40px) scale(1.1); }
    66%  { transform: translate(-40px,50px) scale(0.95); }
    100% { transform: translate(0,0) scale(1); }
  }

  /* Floating petals */
  .petal {
    position: fixed; pointer-events: none; z-index: 1;
    font-size: 1.1rem; opacity: 0;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall {
    0%  { opacity: 0; transform: translateY(-20px) rotate(0deg); }
    10% { opacity: 0.7; }
    90% { opacity: 0.4; }
    100%{ opacity: 0; transform: translateY(105vh) rotate(360deg); }
  }

  /* Diamond sparkles */
  .dia {
    position: fixed; pointer-events: none; z-index: 1;
    color: var(--champagne); font-size: 0.9rem;
    animation: diaGlow 4s ease-in-out infinite;
  }
  @keyframes diaGlow {
    0%,100%{ opacity:0.15; transform:scale(1) rotate(0deg); }
    50%    { opacity:0.9;  transform:scale(1.5) rotate(45deg); }
  }

  /* Header */
  .header {
    text-align: center;
    padding: 3rem 1rem 1.5rem;
    position: relative; z-index: 10;
  }
  .logo-ring {
    width: 90px; height: 90px; margin: 0 auto 1rem;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--mauve), var(--gold), var(--blush));
    display: flex; align-items: center; justify-content: center;
    font-size: 2.4rem;
    box-shadow: 0 0 40px rgba(201,160,220,0.5), 0 0 80px rgba(212,168,67,0.2);
    animation: ringPulse 3s ease-in-out infinite;
  }
  @keyframes ringPulse {
    0%,100%{ box-shadow: 0 0 40px rgba(201,160,220,0.5), 0 0 80px rgba(212,168,67,0.2); }
    50%    { box-shadow: 0 0 60px rgba(201,160,220,0.8), 0 0 120px rgba(212,168,67,0.4); }
  }

  .header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 7vw, 4rem);
    color: var(--champagne);
    letter-spacing: 4px;
    text-shadow: 0 0 30px rgba(212,168,67,0.6), 0 2px 4px rgba(0,0,0,0.4);
    animation: titleShimmer 4s ease-in-out infinite;
  }
  @keyframes titleShimmer {
    0%,100%{ text-shadow: 0 0 30px rgba(212,168,67,0.6), 0 2px 4px rgba(0,0,0,0.4); }
    50%    { text-shadow: 0 0 60px rgba(245,230,200,0.9), 0 0 100px rgba(212,168,67,0.5); }
  }

  .header .subtitle {
    color: rgba(245,230,200,0.65);
    font-size: 1rem; font-weight: 700; letter-spacing: 2px;
    margin-top: 0.5rem; text-transform: uppercase;
  }

  /* Progress */
  .progress-wrap {
    max-width: 700px; margin: 0 auto 1.8rem; padding: 0 1.5rem;
    position: relative; z-index: 10;
  }
  .progress-info {
    display: flex; justify-content: space-between;
    color: rgba(245,230,200,0.8); font-size: 0.85rem;
    font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 1px;
  }
  .progress-bar-bg {
    background: rgba(255,255,255,0.08);
    border-radius: 20px; height: 8px;
    overflow: hidden; border: 1px solid rgba(201,160,220,0.2);
  }
  .progress-bar-fill {
    height: 100%; border-radius: 20px;
    background: linear-gradient(90deg, var(--rose-dark), var(--mauve), var(--gold));
    transition: width 0.7s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .progress-bar-fill::after {
    content:''; position:absolute; top:0; left:-60%;
    width:50%; height:100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.5), transparent);
    animation: shimmer 2.5s linear infinite;
  }
  @keyframes shimmer { to { left: 120%; } }

  /* Card */
  .quiz-wrap {
    max-width: 700px; margin: 0 auto 3rem; padding: 0 1rem;
    position: relative; z-index: 10;
  }

  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(24px);
    border-radius: 24px;
    padding: 2.4rem 2.2rem;
    border: 1px solid rgba(201,160,220,0.25);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .card::before {
    content:''; position:absolute; top:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(212,168,67,0.6), transparent);
  }
  .card::after {
    content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
    background: linear-gradient(90deg, transparent, rgba(201,160,220,0.4), transparent);
  }

  /* Transition animations */
  .card.flip-out {
    animation: flipOut 0.45s cubic-bezier(.55,0,.45,1) forwards;
  }
  .card.flip-in {
    animation: flipIn 0.5s cubic-bezier(.55,0,.45,1);
  }
  .card.zoom-out {
    animation: zoomOut 0.35s ease-in forwards;
  }
  .card.zoom-in {
    animation: zoomIn 0.45s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes flipOut {
    0%  { transform: perspective(800px) rotateY(0deg); opacity:1; }
    100%{ transform: perspective(800px) rotateY(-90deg); opacity:0; }
  }
  @keyframes flipIn {
    0%  { transform: perspective(800px) rotateY(90deg); opacity:0; }
    100%{ transform: perspective(800px) rotateY(0deg); opacity:1; }
  }
  @keyframes zoomOut {
    0%  { transform: scale(1); opacity:1; }
    100%{ transform: scale(0.7); opacity:0; }
  }
  @keyframes zoomIn {
    0%  { transform: scale(1.2) rotate(3deg); opacity:0; }
    100%{ transform: scale(1) rotate(0deg); opacity:1; }
  }

  /* Stardust burst */
  .stardust {
    position: fixed; top:50%; left:50%;
    transform: translate(-50%,-50%);
    pointer-events: none; z-index: 9999;
    font-size: 2.5rem; letter-spacing: 8px;
    display: none;
  }
  .stardust.show {
    display: block;
    animation: stardustBurst 0.8s forwards;
  }
  @keyframes stardustBurst {
    0%  { opacity:1; transform:translate(-50%,-50%) scale(0.3) rotate(0deg); }
    60% { opacity:1; transform:translate(-50%,-50%) scale(1.6) rotate(20deg); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(2) rotate(40deg); }
  }

  /* Question elements */
  .hint-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: linear-gradient(135deg, rgba(212,168,67,0.15), rgba(201,160,220,0.15));
    color: var(--champagne);
    font-size: 0.78rem; font-weight: 700;
    padding: 5px 14px; border-radius: 20px; margin-bottom: 1rem;
    border: 1px solid rgba(212,168,67,0.35);
    animation: badgePop 0.4s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes badgePop { from{transform:scale(0) rotate(-10deg);} to{transform:scale(1) rotate(0deg);} }

  .q-number {
    font-size: 0.8rem; color: var(--gold); font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; margin-bottom: 0.4rem;
  }

  .type-badge {
    display: inline-block; padding: 3px 12px; border-radius: 12px;
    font-size: 0.75rem; font-weight: 700; margin-bottom: 0.8rem; letter-spacing: 0.5px;
  }
  .type-grammar { background: rgba(181,68,110,0.25); color: #f7a8c4; border: 1px solid rgba(181,68,110,0.4); }
  .type-vocab   { background: rgba(201,160,220,0.2); color: #e0c0f0; border: 1px solid rgba(201,160,220,0.4); }
  .type-reading { background: rgba(212,168,67,0.15); color: #f5d78a; border: 1px solid rgba(212,168,67,0.35); }

  .question {
    font-size: clamp(1rem, 2.8vw, 1.2rem);
    font-weight: 700; color: #f0e6f8;
    line-height: 1.8; margin-bottom: 1.5rem;
  }

  .passage {
    background: rgba(255,255,255,0.05);
    border-right: 3px solid var(--gold);
    border-radius: 14px; padding: 1.1rem 1.3rem;
    margin-bottom: 1.2rem;
    font-size: 0.93rem; color: rgba(245,230,200,0.85);
    line-height: 1.9; font-style: italic;
    box-shadow: inset 0 1px 0 rgba(212,168,67,0.1);
  }

  /* Options */
  .options { display: flex; flex-direction: column; gap: 0.8rem; }

  .option-btn {
    background: rgba(255,255,255,0.06);
    border: 1.5px solid rgba(201,160,220,0.2);
    border-radius: 14px; padding: 1rem 1.3rem;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.98rem; font-weight: 600;
    color: #f0e6f8; cursor: pointer;
    text-align: right; display: flex; align-items: center; gap: 12px;
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    position: relative; overflow: hidden;
  }
  .option-btn::before {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(201,160,220,0.15), rgba(212,168,67,0.08));
    opacity:0; transition: opacity 0.2s;
  }
  .option-btn:hover:not(:disabled) {
    border-color: rgba(212,168,67,0.6);
    transform: translateX(-6px) scale(1.015);
    box-shadow: 0 4px 20px rgba(212,168,67,0.15), -4px 0 0 var(--gold);
  }
  .option-btn:hover:not(:disabled)::before { opacity:1; }
  .option-btn .opt-num {
    min-width: 28px; height: 28px; border-radius: 50%;
    background: rgba(201,160,220,0.2); border: 1px solid rgba(201,160,220,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 800; color: var(--mauve);
    transition: all 0.2s;
  }
  .option-btn.correct {
    border-color: #69d194 !important;
    background: rgba(105,209,148,0.15) !important;
    animation: correctGlow 0.5s ease;
  }
  .option-btn.correct .opt-num {
    background: rgba(105,209,148,0.3); border-color: #69d194; color: #69d194;
  }
  .option-btn.wrong {
    border-color: #f07070 !important;
    background: rgba(240,112,112,0.12) !important;
    animation: wrongWobble 0.5s ease;
  }
  .option-btn.wrong .opt-num {
    background: rgba(240,112,112,0.25); border-color: #f07070; color: #f07070;
  }
  @keyframes correctGlow {
    0%,100%{ box-shadow: none; }
    50%{ box-shadow: 0 0 25px rgba(105,209,148,0.5); }
  }
  @keyframes wrongWobble {
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px); }
    40%{ transform:translateX(10px); }
    60%{ transform:translateX(-6px); }
    80%{ transform:translateX(6px); }
  }

  /* Emoji particles */
  .particle { position:fixed; pointer-events:none; z-index:9998; font-size:1.8rem; animation:particleFly 1s ease-out forwards; }
  @keyframes particleFly {
    0%  { opacity:1; transform:translateY(0) scale(1) rotate(0); }
    100%{ opacity:0; transform:translateY(-140px) scale(0.5) rotate(25deg); }
  }

  /* Explanation */
  .explanation {
    margin-top: 1.3rem; padding: 1.1rem 1.3rem;
    border-radius: 14px; font-size: 0.93rem; line-height: 1.75;
    animation: expSlide 0.4s ease; display:none;
  }
  .explanation.show { display:block; }
  .explanation.correct-exp {
    background: rgba(105,209,148,0.1);
    border: 1px solid rgba(105,209,148,0.35); color: #b0f0cc;
  }
  .explanation.wrong-exp {
    background: rgba(240,112,112,0.1);
    border: 1px solid rgba(240,112,112,0.3); color: #ffc0c0;
  }
  @keyframes expSlide { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }

  /* Next button */
  .next-btn {
    width:100%; margin-top:1.4rem; padding:1rem 1.5rem;
    border:none; border-radius:14px;
    background: linear-gradient(135deg, var(--burgundy), var(--mauve));
    color: var(--champagne); font-family:'Tajawal',sans-serif;
    font-size:1.05rem; font-weight:800; cursor:pointer; letter-spacing:1px;
    box-shadow: 0 6px 24px rgba(123,45,94,0.4);
    transition: all 0.25s cubic-bezier(.34,1.56,.64,1);
    position:relative; overflow:hidden; display:none;
  }
  .next-btn::after {
    content:''; position:absolute; inset:0;
    background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
    pointer-events:none;
  }
  .next-btn:hover { transform:scale(1.03) translateY(-2px); box-shadow:0 10px 32px rgba(201,160,220,0.35); }
  .next-btn.show { display:block; animation:expSlide 0.3s ease; }

  /* Result */
  .result-screen { text-align:center; padding:1.5rem 1rem; }

  .result-ring {
    width:120px; height:120px; border-radius:50%; margin:0 auto 1.2rem;
    background: conic-gradient(var(--gold), var(--mauve), var(--rose-dark), var(--gold));
    display:flex; align-items:center; justify-content:center;
    animation: ringPulse 3s infinite;
    position:relative;
  }
  .result-ring-inner {
    width:100px; height:100px; border-radius:50%;
    background:#1a0a2e;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .result-score {
    font-family:'Cormorant Garamond',serif;
    font-size:2.4rem; font-weight:800; color:var(--champagne);
    line-height:1;
  }
  .result-pct { font-size:0.85rem; color:var(--gold); font-weight:700; }

  .result-msg { font-size:1.15rem; font-weight:700; color:rgba(245,230,200,0.9); margin:1.2rem 0 0.5rem; line-height:1.6; }

  .score-breakdown { display:flex; justify-content:center; gap:2.5rem; margin:1.2rem 0; }
  .score-item .num { font-size:2rem; font-weight:900; }
  .score-item .lbl { font-size:0.78rem; color:rgba(245,230,200,0.5); font-weight:600; }
  .correct-num { color:#69d194; }
  .wrong-num   { color:#f07070; }

  .share-btn {
    display:inline-flex; align-items:center; gap:8px;
    margin-top:1.5rem; padding:1rem 2.2rem;
    border:none; border-radius:14px;
    background:linear-gradient(135deg,#25D366,#128C7E);
    color:white; font-family:'Tajawal',sans-serif;
    font-size:1.05rem; font-weight:800; cursor:pointer;
    box-shadow:0 6px 20px rgba(37,211,102,0.3);
    transition:all 0.25s; text-decoration:none;
  }
  .share-btn:hover { transform:scale(1.05); }

  .retry-btn {
    display:block; margin:1rem auto 0; padding:0.8rem 2rem;
    border:1px solid rgba(201,160,220,0.4); border-radius:14px;
    background:transparent; color:rgba(245,230,200,0.7);
    font-family:'Tajawal',sans-serif; font-size:1rem; font-weight:700; cursor:pointer;
    transition:all 0.2s;
  }
  .retry-btn:hover { background:rgba(201,160,220,0.1); color:var(--champagne); }

  @media(max-width:500px){ .card{padding:1.5rem 1rem;} }
</style>
</head>
<body>

<!-- Aurora background -->
<div class="aurora">
  <div class="aurora-layer" style="width:600px;height:600px;top:-100px;right:-100px;background:radial-gradient(circle,rgba(123,45,94,0.6),transparent 70%);animation-duration:18s;"></div>
  <div class="aurora-layer" style="width:500px;height:500px;bottom:-50px;left:-80px;background:radial-gradient(circle,rgba(201,160,220,0.4),transparent 70%);animation-duration:22s;animation-delay:-8s;"></div>
  <div class="aurora-layer" style="width:400px;height:400px;top:30%;left:30%;background:radial-gradient(circle,rgba(212,168,67,0.2),transparent 70%);animation-duration:15s;animation-delay:-5s;"></div>
  <div class="aurora-layer" style="width:350px;height:350px;bottom:20%;right:10%;background:radial-gradient(circle,rgba(181,68,110,0.35),transparent 70%);animation-duration:20s;animation-delay:-12s;"></div>
</div>

<div class="stardust" id="stardust">✦ ✧ ✦ ✧ ✦</div>

<div class="header">
  <div class="logo-ring">💎</div>
  <h1>Lara's Quiz</h1>
  <div class="subtitle">✦ English Mastery for Ambitious Girls ✦</div>
</div>

<div class="progress-wrap" id="progressWrap">
  <div class="progress-info">
    <span id="progressText">✦ سؤال 1 من 30</span>
    <span id="scoreDisplay">Score: 0 ✦</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progressFill" style="width:3.3%"></div>
  </div>
</div>

<div class="quiz-wrap">
  <div class="card" id="quizCard">
    <div id="quizContent"></div>
  </div>
</div>

<script>
const questions = [
  // ===== GRAMMAR (10) =====
  {
    type:"grammar", hint:null,
    q:"You're on the phone with a customer. He asks when the store opens. Which answer is correct?",
    opts:["The store is opening at 9 AM every day.","The store opens at 9 AM every day.","The store opened at 9 AM every day.","The store will open at 9 AM every day."],
    ans:1,
    exp:"الروتين اليومي وال fixed schedule بنستخدم معاهم المضارع البسيط (Simple Present). كلمة 'every day' هي الإشارة الذهبية! 🌟"
  },
  {
    type:"grammar", hint:null,
    q:"Complete: 'Water _____ at 100 degrees Celsius.' (حقيقة علمية)",
    opts:["boiled","is boiling","boils","will boil"],
    ans:2,
    exp:"الحقائق العلمية الثابتة بنستخدم معاها Simple Present. وعلشان water = هي/هو (It) نضيف s للفعل: boil ➔ boils 🔬"
  },
  {
    type:"grammar", hint:null,
    q:"Which sentence correctly uses Simple Past?",
    opts:["I didn't went to the mall yesterday.","I didn't go to the mall yesterday.","I not went to the mall yesterday.","I wasn't go to the mall yesterday."],
    ans:1,
    exp:"بعد didn't الفعل يرجع لأصله (Infinitive) بدون أي إضافات! ❌ didn't went غلط — ✅ didn't go صح. لأن didn't هي اللي بتحمل الماضي! ⏳"
  },
  {
    type:"grammar", hint:"A2+",
    q:"Choose the correct spelling for Simple Present (He/She/It):",
    opts:["She fixs the problem quickly.","She fix the problem quickly.","She fixes the problem quickly.","She fixing the problem quickly."],
    ans:2,
    exp:"لما الفعل بينتهي بـ x نضيف es مش s فقط — fix ➔ fixes. نفس القاعدة لـ: wash ➔ washes / catch ➔ catches 📝"
  },
  {
    type:"grammar", hint:null,
    q:"You just decided to help your colleague right now: 'Don't worry, _____ help you with that report.'",
    opts:["I am","I","I will","I was"],
    ans:2,
    exp:"القرار اللحظي اللي بتاخديه في نفس لحظة الكلام = will! دي واحدة من أهم استخدامات Simple Future 💡"
  },
  {
    type:"grammar", hint:null,
    q:"'She _____ to Dubai last summer and _____ the Burj Khalifa.' (ماضي منتهي)",
    opts:["travelled / seen","travelled / saw","travel / saw","travels / sees"],
    ans:1,
    exp:"كلمة 'last summer' = إشارة للـ Simple Past. travel فعل منتظم ➔ travelled. وsee فعل شاذ ➔ saw (مش seed!) ✈️"
  },
  {
    type:"grammar", hint:null,
    q:"Which sentence correctly talks about the FUTURE?",
    opts:["I think it will rains tomorrow.","I think it will rain tomorrow.","I think it will rained tomorrow.","I think it raining tomorrow."],
    ans:1,
    exp:"بعد will دايماً الفعل في صورته الأصلية (Infinitive) — will rain ✅ وليس will rains ❌ أو will rained ❌ 🌧️"
  },
  {
    type:"grammar", hint:"A2+",
    q:"Identify the PASSIVE sentence in Simple Present:",
    opts:["Ali writes the report every day.","The report is written by Ali every day.","Ali is writing the report.","Ali wrote the report yesterday."],
    ans:1,
    exp:"الـ Passive في المضارع البسيط: Object + is/are + V3. هنا: The report (مفعول) + is + written (التصريف الثالث لـ write) ✍️"
  },
  {
    type:"grammar", hint:null,
    q:"'The package _____ yesterday.' — Choose the correct PASSIVE form.",
    opts:["was delivered","is delivered","were delivered","delivered"],
    ans:0,
    exp:"ماضي بسيط مبني للمجهول = was/were + V3. الـ package مفرد (هي/هو) ➔ was delivered. كلمة yesterday = إشارة الماضي 📦"
  },
  {
    type:"grammar", hint:null,
    q:"'English _____ all over the world.' Which option correctly completes with Passive Present?",
    opts:["speaks","spoken","is spoken","are spoken"],
    ans:2,

    opts:["welcomes","serves","ensures","None — there is no passive in this passage"],
    ans:3,
    exp:"صح! في القطعة دي مفيش جملة مبنية للمجهول. كل الأفعال Active — الفاعل (Rania) بيعمل الفعل. عين واعية! 👁️✨"
  }

// Which 5 questions are A2+ (0-indexed)
const hintQs = [3, 7, 12, 16, 26];

let current = 0, score = 0, answered = false;
// Alternate between flip and zoom transitions
const transOut = ['flip-out','zoom-out','flip-out','zoom-out'];
const transIn  = ['flip-in', 'zoom-in', 'flip-in', 'zoom-in'];

function buildDecorations() {
  const petals = ['🌸','🌺','✿','❀','🌷'];
  for(let i=0;i<14;i++){
    const p = document.createElement('div');
    p.className = 'petal';
    p.textContent = petals[Math.floor(Math.random()*petals.length)];
    p.style.cssText = `left:${Math.random()*100}%;animation-duration:${10+Math.random()*15}s;animation-delay:${Math.random()*12}s;font-size:${0.8+Math.random()*0.8}rem;`;
    document.body.appendChild(p);
  }
  for(let i=0;i<10;i++){
    const d = document.createElement('div');
    d.className = 'dia';
    d.textContent = ['✦','✧','◆','◇','✴'][Math.floor(Math.random()*5)];
    d.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${3+Math.random()*3}s;`;
    document.body.appendChild(d);
  }
}

function renderQ() {
  answered = false;
  const q = questions[current];
  const isA2 = hintQs.includes(current);
  const typeLabel = {grammar:'Grammar 📝', vocab:'Vocabulary 💬', reading:'Reading 📖'}[q.type];
  const typeClass = {grammar:'type-grammar', vocab:'type-vocab', reading:'type-reading'}[q.type];

  let html = `<div class="q-number">✦ QUESTION ${current+1} OF 30</div>
              <div class="type-badge ${typeClass}">${typeLabel}</div>`;

  if(isA2) html += `<div class="hint-badge">💡 تلميح: السؤال ده فيه تحدي إضافي!</div>`;
  if(q.passage) html += `<div class="passage">${q.passage}</div>`;

  html += `<div class="question">${q.q}</div><div class="options" id="optionsDiv">`;
  ['A','B','C','D'].forEach((letter,i) => {
    html += `<button class="option-btn" onclick="choose(${i})" id="opt${i}">
      <span class="opt-num">${letter}</span>${q.opts[i]}
    </button>`;
  });
  html += `</div><div class="explanation" id="expBox"></div>
           <button class="next-btn" id="nextBtn" onclick="nextQ()">
             ${current < questions.length-1 ? 'التالي ✦' : 'النتيجة 🎊'}
           </button>`;

  document.getElementById('quizContent').innerHTML = html;
  document.getElementById('progressText').textContent = `✦ سؤال ${current+1} من 30`;
  document.getElementById('progressFill').style.width = `${((current+1)/30)*100}%`;
  document.getElementById('scoreDisplay').textContent = `Score: ${score} ✦`;
}

function choose(idx) {
  if(answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll('.option-btn').forEach(o => o.disabled = true);
  const expBox = document.getElementById('expBox');
  const nextBtn = document.getElementById('nextBtn');

  if(idx === q.ans) {
    score++;
    document.getElementById(`opt${idx}`).classList.add('correct');
    document.getElementById(`opt${idx}`).innerHTML += ' ✓';
    expBox.className = 'explanation show correct-exp';
    expBox.innerHTML = `<strong>✦ ممتاز! إجابة صحيحة!</strong><br>${q.exp}`;
    document.getElementById('scoreDisplay').textContent = `Score: ${score} ✦`;
    fireParticles(['✦','💎','🌸','⭐','💜'], document.getElementById(`opt${idx}`));
    showStardust();
  } else {
    document.getElementById(`opt${idx}`).classList.add('wrong');
    document.getElementById(`opt${idx}`).innerHTML += ' ✗';
    document.getElementById(`opt${q.ans}`).classList.add('correct');
    document.getElementById(`opt${q.ans}`).innerHTML += ' ✓';
    expBox.className = 'explanation show wrong-exp';
    expBox.innerHTML = `<strong>💫 مش صح — خلينا نتعلم سوا!</strong><br>${q.exp}`;
  }
  nextBtn.classList.add('show');
}

function fireParticles(items, anchor) {
  const rect = anchor.getBoundingClientRect();
  for(let i=0;i<6;i++){
    setTimeout(()=>{
      const el = document.createElement('div');
      el.className = 'particle';
      el.textContent = items[Math.floor(Math.random()*items.length)];
      el.style.cssText = `left:${rect.left+Math.random()*rect.width}px;top:${rect.top+window.scrollY}px;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1000);
    }, i*90);
  }
}

function showStardust() {
  const s = document.getElementById('stardust');
  s.classList.add('show');
  setTimeout(()=>s.classList.remove('show'), 800);
}

function nextQ() {
  if(current >= questions.length - 1) {
    // آخر سؤال — اعرض النتيجة مباشرة بدون animation
    console.log('Show result now');
    showResult();
  } else {
    // سؤال عادي — استخدم animation
    const card = document.getElementById('quizCard');
    const ti = Math.floor(current/2) % 2;
    card.classList.add(transOut[ti*2]);

    setTimeout(()=>{
      current++;
      card.classList.remove(transOut[ti*2], transOut[ti*2+1]);
      renderQ();
      card.classList.add(transIn[ti*2]);
      setTimeout(()=>card.classList.remove(transIn[ti*2], transIn[ti*2+1]), 500);
    }, 420);
  }
}

function showResult() {
  const pct = Math.round((score/30)*100);
  let emoji, msg;
  if(pct >= 90)      { emoji='👑'; msg='Exceptional! إنتي ready للعالم كله! أي كول سنتر أو سفر أو شغل هيبقى حاجة سهلة عليكي 🌍'; }
  else if(pct >= 70) { emoji='💎'; msg='Brilliant! مستواكي عالي جداً — كمان خطوة وتوصلي للـ Professional Level! 🚀'; }
  else if(pct >= 50) { emoji='🌸'; msg='Good Progress! إنتي في الطريق الصح يا قمر، استمري والنتيجة هتفرق! 💪'; }
  else               { emoji='✦';  msg='Keep Shining! كل رحلة بتبدأ بخطوة — إنتي بدأتي بالفعل وده أهم حاجة! 🌟'; }

  const waText = encodeURIComponent(`✦ نتيجة Lara's English Quiz ✦\n\n💎 النتيجة: ${score} من 30 (${pct}%)\n\n${msg}\n\n#Lara_Quiz #English #Engleezi_Bel`);

  console.log('Creating result HTML');
  
  const resultHTML = `
    <div class="result-screen">
      <div class="result-ring">
        <div class="result-ring-inner">
          <div class="result-score">${score}/30</div>
          <div class="result-pct">${pct}%</div>
        </div>
      </div>
      <div style="font-size:2.5rem;">${emoji}</div>
      <div class="score-breakdown">
        <div class="score-item"><div class="num correct-num">${score}</div><div class="lbl">Correct ✓</div></div>
        <div class="score-item"><div class="num wrong-num">${30-score}</div><div class="lbl">Wrong ✗</div></div>
      </div>
      <div class="result-msg">${msg}</div>
      <a class="share-btn" href="https://wa.me/201144576661?text=${waText}" target="_blank">
        📱 شاركي نتيجتك على واتساب
      </a>
      <button class="retry-btn" onclick="location.reload()">↺ حاولي تاني</button>
    </div>`;

  document.getElementById('quizCard').innerHTML = resultHTML;
  document.getElementById('progressWrap').style.display = 'none';
  
  console.log('Result should be visible now');
  
  showStardust();
  for(let i=0;i<12;i++) {
    setTimeout(()=>{
      const el=document.createElement('div');
      el.className='particle';
      el.textContent=['✦','💎','🌸','👑','💜','✧'][Math.floor(Math.random()*6)];
      el.style.cssText=`left:${5+Math.random()*90}vw;top:${15+Math.random()*70}vh;font-size:2.2rem;`;
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),1100);
    },i*130);
  }
}

buildDecorations();
renderQ();
</script>
